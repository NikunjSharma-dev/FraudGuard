services:
  # 1. PostgreSQL 16 Ledger Database
  postgres:
    image: postgres:16-alpine
    container_name: fraud_postgres
    environment:
      POSTGRES_DB: frauddb
      POSTGRES_USER: frauduser
      POSTGRES_PASSWORD: fraudpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frauduser -d frauddb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Redis Cache (In-memory Feature Store & OTP Cache)
  redis:
    image: redis:7-alpine
    container_name: fraud_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraud_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://frauduser:fraudpass@postgres:5432/frauddb
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: "http://localhost:8501,http://streamlit:8501,http://localhost:3000,http://127.0.0.1:3000"
      SECRET_KEY: "change-me-to-something-secure"
      ENV: "development"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: always

  # 4. Streamlit Dashboard
  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: fraud_streamlit
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app:/app
    restart: always

volumes:
  postgres_data:
  redis_data: